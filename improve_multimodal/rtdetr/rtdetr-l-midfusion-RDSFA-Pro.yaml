# RDSFA-Net Pro (~130M params)
# Custom M+ scale: max_ch=1536, hd=384, 500q, 8dl
ch: 6
nc: 80
scales:
  m: [1.00, 1.00, 1536]

backbone:
  # Input
  - [-1, 1, IN, []]                              # 0
  - [-1, 1, Multiin, [1]]                        # 1 (RGB)
  - [-2, 1, Multiin, [2]]                        # 2 (IR)
  # RGB Stage 1
  - [1, 1, HGStem, [32, 64]]                     # 3
  - [-1, 5, ModalityHGBlock_RGB, [64, 128, 3]]   # 4 (128ch)
  # IR Stage 1
  - [2, 1, HGStem, [32, 64]]                     # 5
  - [-1, 5, ModalityHGBlock_IR, [64, 128, 3]]    # 6 (128ch)
  # Early interaction
  - [[4, 6], 1, CrossModalInteraction, [128]]     # 7 → 256ch
  - [7, 1, SplitRGB, []]                         # 8 → 128ch
  - [7, 1, SplitIR, []]                          # 9 → 128ch
  # RGB Stage 2
  - [8, 1, DWConv, [128, 3, 2, 1, False]]        # 10
  - [-1, 5, ModalityHGBlock_RGB, [96, 384, 3]]   # 11 (384ch)
  # RGB Stage 3 (×5 blocks)
  - [-1, 1, DWConv, [384, 3, 2, 1, False]]       # 12
  - [-1, 5, ModalityHGBlock_RGB, [192, 768, 5, True, False]]  # 13
  - [-1, 5, ModalityHGBlock_RGB, [192, 768, 5, True, True]]   # 14
  - [-1, 5, ModalityHGBlock_RGB, [192, 768, 5, True, True]]   # 15
  - [-1, 5, ModalityHGBlock_RGB, [192, 768, 5, True, True]]   # 16
  - [-1, 5, ModalityHGBlock_RGB, [192, 768, 5, True, True]]   # 17
  # RGB Stage 4
  - [-1, 1, DWConv, [768, 3, 2, 1, False]]       # 18
  - [-1, 5, ModalityHGBlock_RGB, [384, 1536, 5, True, False]] # 19 (1536ch)
  # IR Stage 2
  - [9, 1, DWConv, [128, 3, 2, 1, False]]        # 20
  - [-1, 5, ModalityHGBlock_IR, [96, 384, 3]]    # 21 (384ch)
  # IR Stage 3 (×5 blocks)
  - [-1, 1, DWConv, [384, 3, 2, 1, False]]       # 22
  - [-1, 5, ModalityHGBlock_IR, [192, 768, 5, True, False]]  # 23
  - [-1, 5, ModalityHGBlock_IR, [192, 768, 5, True, True]]   # 24
  - [-1, 5, ModalityHGBlock_IR, [192, 768, 5, True, True]]   # 25
  - [-1, 5, ModalityHGBlock_IR, [192, 768, 5, True, True]]   # 26
  - [-1, 5, ModalityHGBlock_IR, [192, 768, 5, True, True]]   # 27
  # IR Stage 4
  - [-1, 1, DWConv, [768, 3, 2, 1, False]]       # 28
  - [-1, 5, ModalityHGBlock_IR, [384, 1536, 5, True, False]] # 29 (1536ch)

  # RDRFA Fusion (v2)
  - [[11, 21], 1, RDRFusion, []]   # 30 P3 (384ch)
  - [[13, 23], 1, RDRFusion, []]   # 31 P4 (768ch)
  - [[19, 29], 1, RDRFusion, []]   # 32 P5 (1536ch)

  # Cross-scale refinement
  - [[30, 31], 1, CrossScaleFusion, []]  # 33: P3→refine P4 → 768ch
  - [[33, 32], 1, CrossScaleFusion, []]  # 34: ref.P4→refine P5 → 1536ch

head:
  - [34, 1, Conv, [384, 1, 1, None, 1, 1, False]]  # 35 input_proj.2
  - [-1, 1, AIFI, [1536, 8]]  # 36
  - [-1, 1, Conv, [384, 1, 1]]  # 37 Y5
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 38
  - [33, 1, Conv, [384, 1, 1, None, 1, 1, False]]  # 39 input_proj.1
  - [[-2, -1], 1, Concat, [1]]  # 40
  - [-1, 3, RepC3, [384]]  # 41
  - [-1, 1, Conv, [384, 1, 1]]  # 42 Y4
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 43
  - [30, 1, Conv, [384, 1, 1, None, 1, 1, False]]  # 44 input_proj.0
  - [[-2, -1], 1, Concat, [1]]  # 45
  - [-1, 3, RepC3, [384]]  # 46
  - [-1, 1, Conv, [384, 3, 2]]  # 47
  - [[-1, 42], 1, Concat, [1]]  # 48
  - [-1, 3, RepC3, [384]]  # 49
  - [-1, 1, Conv, [384, 3, 2]]  # 50
  - [[-1, 37], 1, Concat, [1]]  # 51
  - [-1, 3, RepC3, [384]]  # 52
  - [[46, 49, 52], 1, RTDETRDecoder, [nc, 384, 500, 8]]
